<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reward Network</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: #1769e0;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 18px;
      padding-bottom: 90px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .welcome {
      margin-bottom: 18px;
    }

    .welcome h2 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .welcome p {
      color: #666;
      font-size: 14px;
    }

    .balance-card {
      background: linear-gradient(135deg, #1769e0, #4b9cff);
      color: white;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 5px 15px rgba(23, 105, 224, 0.2);
    }

    .balance-card p {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .balance-card h2 {
      font-size: 34px;
      margin-bottom: 5px;
    }

    .balance-card small {
      opacity: 0.85;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .card h3 {
      margin-bottom: 12px;
      font-size: 19px;
    }

    .task-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .task-text {
      color: #666;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .reward {
      color: #1769e0;
      font-weight: bold;
      margin-bottom: 16px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: bold;
      width: 100%;
      background: #1769e0;
      color: white;
    }

    button:hover {
      background: #0d56bd;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .secondary-btn {
      background: #e8f0ff;
      color: #1769e0;
    }

    .secondary-btn:hover {
      background: #d7e6ff;
    }

    .danger-btn {
      background: #e53935;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      background: #e7f7ed;
      color: #16803c;
    }

    .error {
      background: #ffeded;
      color: #c62828;
    }

    .info {
      background: #e8f0ff;
      color: #1769e0;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: white;
      border-radius: 14px;
      padding: 17px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }

    .stat-box h3 {
      color: #1769e0;
      font-size: 22px;
      margin-bottom: 5px;
    }

    .stat-box p {
      color: #777;
      font-size: 13px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      margin-bottom: 15px;
      outline: none;
      background: white;
    }

    input:focus, select:focus {
      border-color: #1769e0;
    }

    .withdraw-note {
      background: #fff8e1;
      color: #8a6500;
      padding: 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .history-item {
      border-bottom: 1px solid #eee;
      padding: 14px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item strong {
      display: block;
      margin-bottom: 5px;
    }

    .history-item small {
      color: #888;
      font-size: 12px;
    }

    .pending {
      color: #f39c12;
      font-size: 13px;
      font-weight: bold;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 15px 0;
      font-size: 14px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px 5px;
      z-index: 10;
    }

    .nav-btn {
      background: transparent;
      color: #777;
      width: 25%;
      padding: 8px 3px;
      font-size: 12px;
      border-radius: 8px;
    }

    .nav-btn.active {
      color: #1769e0;
      background: #e8f0ff;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }
